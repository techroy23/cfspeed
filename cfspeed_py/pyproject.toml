[build-system]
requires = ["setuptools>=69.0.2"]
build-backend = "setuptools.build_meta"

[project]
name = "cfspeed"
version = "1.0.3"
description = "Cloudflare speed test library"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["speedtest", "cloudflare", "network", "benchmark"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Benchmark",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/techroy23/cfspeed"
Source = "https://github.com/techroy23/cfspeed"

[project.optional-dependencies]
socks5 = ["PySocks>=1.7.1"]

[project.scripts]
cfspeed = "cfspeed.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cfspeed*"]
